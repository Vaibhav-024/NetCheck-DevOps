name: NetCheck Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Build and Test Android App

    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 5: Give permission to Gradle wrapper
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Step 6: Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 7: Build Android APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Step 8: Upload APK as Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetCheck-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
